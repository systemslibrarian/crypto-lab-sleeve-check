name: CI

# Pre-merge validation: typecheck, unit tests (incl. the spec KATs), build, the
# axe accessibility gate and the claims suite. Runs on pull requests so a failing
# cryptographic or browser test blocks merge BEFORE it reaches main. This job
# never receives Pages write permissions -- deployment lives only in deploy.yml.
#
# The gate here must stay a superset of the one deploy.yml runs. If auto-merge
# were gated on a lighter workflow than the deploy, a bump that breaks the
# heavier gate would merge cleanly and then the deploy would fail, so main would
# silently stop shipping with nothing red in between.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (Vitest, incl. the RFC 7801 section 5 KATs)
        run: npm test
      - name: Build (typecheck gates the build)
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: A11y gate + claims suite
        run: npm run test:e2e:all

  # Dependabot only. Depends on the gate job in this workflow, so a bump can only
  # merge itself once this lab's whole PR gate went green.
  dependabot-auto-merge:
    needs: validate
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      # Majors included on purpose. `needs:` above already required the whole
      # gate to pass, and that gate -- unit tests, build, axe WCAG and the
      # claims suite -- judges a bump far better than its version number does.
      # A major that actually breaks this lab fails the gate and stays open.
      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          # The filename is deploy.yml in THIS repo -- checked, not copied.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
