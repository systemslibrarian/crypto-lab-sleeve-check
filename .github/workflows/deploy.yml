name: Deploy to GitHub Pages

# ONE workflow, ONE gate. The gate a Dependabot bump merges against is literally
# the gate the deploy runs -- a single `build` job, named in `needs:` by both
# `deploy` and `dependabot-auto-merge`. There is deliberately no second ci.yml:
# elsewhere in this fleet a split pair drifted apart, auto-merge hung off the
# lighter of the two, a grouped minor bump floated a deliberately pinned
# @playwright/test version back up past a gate that could not see what the pin
# was holding down, and main quietly stopped shipping with nothing red in
# between. A second copy of a gate is how two gates drift.

on:
  push:
    branches: [main]
  # The gate has to judge pull requests too, or auto-merge has nothing to wait on.
  pull_request:
    branches: [main]
  # Required by the post-merge dispatch at the bottom of this file.
  workflow_dispatch:

# Least privilege at workflow scope. `build` runs on every pull request,
# including Dependabot's, so it must not inherit the Pages write and OIDC
# permissions only the deploy step needs -- those are granted on the `deploy`
# job alone, below.
permissions:
  contents: read

concurrency:
  # Keyed by ref, NOT a bare `pages`. With pull_request as a trigger and
  # cancel-in-progress on, a bare group would let a PR run cancel a live main
  # deploy -- and `cancelled` is one of the shapes that ships nothing while
  # looking like nothing went wrong.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes. A hung browser test would otherwise sit
    # there for six hours looking stuck rather than failing; the full run here
    # takes well under two.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (Vitest, incl. the RFC 7801 section 5 KATs)
        run: npm test
      - name: Build (typecheck gates the build)
        run: npm run build
      - name: Install Playwright browsers
        # All three engines: the axe gate is Chromium-only by design, but the
        # critical-path flows run in Firefox and WebKit too, and an engine that
        # is only exercised locally is an engine nobody is checking.
        run: npx playwright install --with-deps chromium firefox webkit
      # Every Playwright project, in one command. What a Dependabot bump merges
      # against is therefore exactly what deploys -- which is the whole point of
      # this file having one gate job.
      - name: Axe gate, claims suite, and cross-browser flows
        run: npm run test:e2e:all
      # Upload only on the paths that can actually deploy. On a pull request
      # `deploy` is skipped, so an artifact there is work nothing consumes.
      #
      # There is deliberately no `actions/configure-pages` step. It exists to
      # read the site's base URL back into a build and to switch Pages on; this
      # repo hardcodes its Vite base and Pages is already set to build_type
      # "workflow". Keeping it would mean granting this job -- which runs on
      # every pull request, Dependabot's included -- a Pages permission solely
      # to read a value nothing uses.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    # NOT `== 'push'`. That also skips workflow_dispatch, which is the one
    # trigger the post-auto-merge deploy depends on: the dispatched run would
    # build, pass the gate, and then skip this job, so the site never updates.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # Dependabot only. `needs: build` is the whole safety argument -- the gate
  # decides, not the version number.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
      # Majors included on purpose. `needs:` above already required the whole
      # gate to pass, and that gate -- unit tests, build, axe WCAG and the
      # claims suite -- judges a bump far better than its version number does.
      # A major that actually breaks this lab fails the gate and stays open.
      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          #
          # deploy.yml is this file, and after the consolidation above it is the
          # only workflow this repo has -- so the dispatched name cannot drift off
          # a file that does not exist. That failure 404s ONLY on the auto-merge
          # path and only after the merge has landed, so it is invisible until a
          # bump merges and the site quietly stops updating.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
